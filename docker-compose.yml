version: "3.9"

services:

  backend:
    build: ./backend
    container_name: entropy_backend
    ports:
      - "3000:3000"
    volumes:
      - sqlite_data:/src/db/data
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  frontend:
    build: ./client
    container_name: entropy_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    container_name: entropy_redis
    ports:
      - "6379:6379"

volumes:
  sqlite_data: